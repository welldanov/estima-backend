[project]
name = "estima-backend"
version = "0.1.0"
description = "Estima backend: real estate price prediction API, ML and data pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
estima-backend = "estima_backend:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
